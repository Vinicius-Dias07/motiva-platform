services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-motiva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motiva}
      POSTGRES_DB: ${POSTGRES_DB:-motiva}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-motiva} -d ${POSTGRES_DB:-motiva}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-motiva}:${POSTGRES_PASSWORD:-motiva}@db:5432/${POSTGRES_DB:-motiva}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      ROBOFLOW_API_URL: ${ROBOFLOW_API_URL:-https://serverless.roboflow.com}
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:?defina ROBOFLOW_API_KEY no .env}
      ROBOFLOW_WORKSPACE_NAME: ${ROBOFLOW_WORKSPACE_NAME:?defina ROBOFLOW_WORKSPACE_NAME no .env}
      ROBOFLOW_WORKFLOW_ID: ${ROBOFLOW_WORKFLOW_ID:?defina ROBOFLOW_WORKFLOW_ID no .env}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: dashboard_figma/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
